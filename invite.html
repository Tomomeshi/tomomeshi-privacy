<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>トモメシ 招待</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; background: #FAF7F2; color: #1B1B19;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    line-height: 1.9; font-size: 16px;
  }
  main { max-width: 560px; margin: 0 auto; padding: 48px 20px 96px; }
  h1 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 24px; letter-spacing: .04em; margin: 0 0 8px; }
  .lead { color: #4B4741; margin: 0 0 28px; }
  .box {
    background: #FFFFFF; border: 1px solid #E7E1D8; border-radius: 14px;
    padding: 18px 20px; margin: 16px 0;
  }
  .box h2 { font-size: 15px; margin: 0 0 10px; color: #8A857C; font-weight: 600; }
  .id { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
  /*
    **`hidden` を CSS で打ち消さない。**（2026-09-24・公開されている面を開いて見つけた）
    下の `.btn` が `display: block` を持っているので、`<a ... hidden>` のストアのボタン2つが
    **消えずに出ていた**。押しても `href="#"` なので何も起きない ──
    招待された人がいちばん最初に押すボタンがこれだった
  */
  [hidden] { display: none !important; }
  .btn {
    display: block; text-align: center; text-decoration: none;
    background: #1F6F5C; color: #FFFFFF; border-radius: 12px; padding: 14px 16px; font-weight: 700;
  }
  .btn.sub { background: transparent; color: #1F6F5C; border: 1.5px solid #1F6F5C; margin-top: 10px; }
  .soon { color: #8A857C; font-size: 14px; margin: 8px 0 0; }
  ol { padding-left: 22px; margin: 8px 0 0; }
  footer { margin-top: 56px; color: #A8A093; font-size: 12px; }
  footer a { color: #8A857C; }
</style>
</head>
<body>
<main>
  <h1 id="title">「トモメシ」の招待です</h1>
  <p class="lead">友だちが実際に行った店だけの地図。点数もランキングもありません。</p>

  <div class="box">
    <h2>1. アプリを入れる</h2>
    <!-- ストアに公開したら、下の2つの href を本物の URL に差し替えて「準備中」の段落を消す（→ docs/release-flow.md） -->
    <a class="btn" id="play" href="#" hidden>Google Play で入手</a>
    <a class="btn sub" id="ios" href="#" hidden>App Store で入手</a>
    <p class="soon" id="soon">ストアで公開の準備をしています。公開したら、このページからダウンロードできます。</p>
  </div>

  <div class="box" id="friend" hidden>
    <h2>2. 入れたら、この人と友だちになる</h2>
    <p class="id" id="handle"></p>
    <ol>
      <li>アプリの下の「友だち」を押す</li>
      <li>「＋ 友だちを追加」→「IDで探す」</li>
      <li>上の ID を打って「申請」</li>
    </ol>
    <a class="btn sub" id="open" href="#">もうアプリを入れている人はこちら（アプリで開く）</a>
  </div>

  <footer>
    <a href="./terms.html">利用規約</a> ・ <a href="./index.html">プライバシーポリシー</a>
  </footer>
</main>
<script>
  // 招待の文に付く住所: invite.html?id=<ID>&n=<名前>。ID は英数と _ だけ・名前は30字まで（それ以外は無視）
  (function () {
    var q = new URLSearchParams(location.search);
    var id = (q.get('id') || '').trim();
    var name = (q.get('n') || '').trim().slice(0, 30);
    if (!/^[a-zA-Z0-9_]{3,20}$/.test(id)) id = '';
    if (name) document.getElementById('title').textContent = name + 'さんから「トモメシ」の招待です';
    if (id) {
      document.getElementById('handle').textContent = '@' + id;
      document.getElementById('friend').hidden = false;
      document.getElementById('open').setAttribute('href', 'tomomeshi://add-friend?id=' + encodeURIComponent(id));
    }
  })();
</script>
</body>
</html>
